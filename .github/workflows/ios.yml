name: iOS App Store Connect

# Builds the Capacitor iOS app on macos-latest and uploads an IPA to App Store
# Connect for Internal TestFlight. Milestone 5 is not done until the owner
# verifies save persistence and background loop pause on a real iPhone.
# Do not submit for App Store review from this workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    name: Build and upload IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: app.islandidle.game
      WIDGET_BUNDLE_ID: app.islandidle.game.IslandActivities
      APP_SCHEME: App
      XCODE_PROJECT: ios/App/App.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require App Store and signing secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8 \
            APPLE_TEAM_ID \
            BUILD_CERTIFICATE_BASE64 \
            BUILD_CERTIFICATE_PASSWORD \
            PROVISIONING_PROFILE_BASE64 \
            PROVISIONING_PROFILE_WIDGET_BASE64
          do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing secrets under Settings → Secrets and variables → Actions."
            echo "PROVISIONING_PROFILE_WIDGET_BASE64 is the App Store profile for app.islandidle.game.IslandActivities."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: |
          # Vite 8 pulls OS-specific optional natives (rolldown, lightningcss,
          # …). A Linux-authored package-lock makes npm ci skip darwin
          # packages (npm/cli#4828). Resolve on this Mac runner instead;
          # the committed lockfile stays for local/Linux installs.
          rm -f package-lock.json
          npm install
          test -d node_modules/@rolldown/binding-darwin-arm64
          test -d node_modules/lightningcss-darwin-arm64
          ls node_modules/@rolldown/ node_modules/lightningcss*

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_WIDGET_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          PP_WIDGET_PATH="$RUNNER_TEMP/build_pp_widget.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          echo -n "$PROVISIONING_PROFILE_WIDGET_BASE64" | base64 --decode -o "$PP_WIDGET_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local path="$1"
            local uuid name
            uuid="$(security cms -D -i "$path" | plutil -extract UUID raw -)"
            name="$(security cms -D -i "$path" | plutil -extract Name raw -)"
            cp "$path" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "${uuid}|${name}"
          }

          APP_INFO="$(install_profile "$PP_PATH")"
          WIDGET_INFO="$(install_profile "$PP_WIDGET_PATH")"
          echo "PROVISIONING_PROFILE_UUID=${APP_INFO%%|*}" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=${APP_INFO#*|}" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_WIDGET_UUID=${WIDGET_INFO%%|*}" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_WIDGET_NAME=${WIDGET_INFO#*|}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -c '
          import os, pathlib, plistlib
          data = {
            "method": "app-store",
            "teamID": os.environ["APPLE_TEAM_ID"],
            "signingStyle": "manual",
            "signingCertificate": "Apple Distribution",
            "destination": "export",
            "provisioningProfiles": {
              os.environ["BUNDLE_ID"]: os.environ["PROVISIONING_PROFILE_NAME"],
              os.environ["WIDGET_BUNDLE_ID"]: os.environ["PROVISIONING_PROFILE_WIDGET_NAME"],
            },
          }
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          with path.open("wb") as handle:
            plistlib.dump(data, handle)
          print(path)
          '

      - name: Apply manual provisioning to App and widget targets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = path.read_text()
          team = os.environ["APPLE_TEAM_ID"]
          app_profile = os.environ["PROVISIONING_PROFILE_NAME"]
          widget_profile = os.environ["PROVISIONING_PROFILE_WIDGET_NAME"]

          def set_setting(block: str, key: str, value: str) -> str:
              pattern = rf'^(\t+){re.escape(key)} = [^;]+;'
              line_value = value if value.startswith('"') else value
              replacement = rf'\1{key} = {line_value};'

              def repl(match: re.Match[str]) -> str:
                  tabs = match.group(1)
                  return f"{tabs}{key} = {line_value};"

              new_block, count = re.subn(pattern, repl, block, count=1, flags=re.M)
              if count:
                  return new_block
              # Insert after buildSettings = {
              return re.sub(
                  r'(buildSettings = \{\n)(\t+)',
                  rf'\1\2{key} = {line_value};\n\2',
                  block,
                  count=1,
              )

          def patch_target(block: str, profile: str) -> str:
              block = set_setting(block, "CODE_SIGN_STYLE", "Manual")
              block = set_setting(block, "CODE_SIGN_IDENTITY", '"Apple Distribution"')
              block = set_setting(block, "DEVELOPMENT_TEAM", team)
              block = set_setting(block, "PROVISIONING_PROFILE_SPECIFIER", f'"{profile}"')
              return block

          def patch_by_bundle(text: str, bundle: str, profile: str) -> str:
              parts = []
              idx = 0
              for match in re.finditer(
                  r'/\* (Debug|Release) \*/ = \{.*?buildSettings = \{.*?\};.*?\n\t\t\tname = \1;',
                  text,
                  flags=re.S,
              ):
                  block = match.group(0)
                  parts.append(text[idx:match.start()])
                  if f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};" in block:
                      block = patch_target(block, profile)
                  parts.append(block)
                  idx = match.end()
              parts.append(text[idx:])
              return "".join(parts)

          text = patch_by_bundle(text, "app.islandidle.game", app_profile)
          text = patch_by_bundle(text, "app.islandidle.game.IslandActivities", widget_profile)
          path.write_text(text)
          assert f'PROVISIONING_PROFILE_SPECIFIER = "{app_profile}";' in text
          assert f'PROVISIONING_PROFILE_SPECIFIER = "{widget_profile}";' in text
          print(f"App profile: {app_profile}")
          print(f"Widget profile: {widget_profile}")
          PY

      - name: Archive App scheme
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="0.1.0" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found under $RUNNER_TEMP/ipa"
            ls -la "$RUNNER_TEMP/ipa" || true
            exit 1
          fi
          echo "Uploading ${IPA_PATH}"

          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > \
            "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up keychain and API key
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$HOME/private_keys/AuthKey_"*.p8
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROVISIONING_PROFILE_UUID:-}.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROVISIONING_PROFILE_WIDGET_UUID:-}.mobileprovision"
